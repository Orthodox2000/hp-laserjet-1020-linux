<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-label="Troubleshooting decision tree">
  <defs>
    <marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1240" height="700" fill="#ffffff"/>
  <text x="620" y="44" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">"I sent a job but nothing printed" — decision tree</text>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15">
    <!-- start -->
    <rect x="470" y="80" width="300" height="60" rx="12" fill="#0f172a"/>
    <text x="620" y="117" text-anchor="middle" fill="#f8fafc" font-weight="700" font-size="17">Job reports "completed"</text>

    <!-- q1 -->
    <rect x="430" y="180" width="380" height="62" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="620" y="208" text-anchor="middle" fill="#1e3a8a" font-weight="700">Does the device ID contain FWVER?</text>
    <text x="620" y="230" text-anchor="middle" fill="#475569" font-size="13">sudo modprobe usblp; sudo usb_printerid /dev/usb/lp0</text>

    <path d="M620,140 L620,178" stroke="#64748b" stroke-width="2" marker-end="url(#d)" fill="none"/>

    <!-- yes -> queue -->
    <path d="M810,211 L950,211" stroke="#16a34a" stroke-width="2" marker-end="url(#d)" fill="none"/>
    <text x="880" y="200" text-anchor="middle" fill="#16a34a" font-weight="700">yes</text>
    <rect x="960" y="180" width="250" height="62" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="1085" y="208" text-anchor="middle" fill="#166534" font-weight="700">Firmware is fine</text>
    <text x="1085" y="230" text-anchor="middle" fill="#334155" font-size="13">check queue / driver (doc 04, 07)</text>

    <!-- no -> firmware -->
    <path d="M620,242 L620,300" stroke="#dc2626" stroke-width="2" marker-end="url(#d)" fill="none"/>
    <text x="645" y="278" fill="#dc2626" font-weight="700">no</text>
    <rect x="430" y="302" width="380" height="66" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="620" y="332" text-anchor="middle" fill="#991b1b" font-weight="700">Firmware missing or wrong format</text>
    <text x="620" y="354" text-anchor="middle" fill="#7f1d1d" font-size="13">install sihp1020.dl  →  docs/03</text>

    <!-- q2 -->
    <rect x="430" y="410" width="380" height="62" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="620" y="438" text-anchor="middle" fill="#92400e" font-weight="700">After upload, does FWVER appear?</text>
    <text x="620" y="460" text-anchor="middle" fill="#78350f" font-size="13">head -c2 sihp1020.dl → must be "20" (ACL), not ELF</text>
    <path d="M620,368 L620,408" stroke="#64748b" stroke-width="2" marker-end="url(#d)" fill="none"/>

    <!-- yes print -->
    <path d="M810,441 L950,441" stroke="#16a34a" stroke-width="2" marker-end="url(#d)" fill="none"/>
    <text x="880" y="430" text-anchor="middle" fill="#16a34a" font-weight="700">yes</text>
    <rect x="960" y="410" width="250" height="62" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="1085" y="446" text-anchor="middle" fill="#166534" font-weight="700">Done — it prints</text>

    <!-- no format -->
    <path d="M620,472 L620,530" stroke="#dc2626" stroke-width="2" marker-end="url(#d)" fill="none"/>
    <text x="645" y="508" fill="#dc2626" font-weight="700">no</text>
    <rect x="330" y="532" width="580" height="66" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="620" y="562" text-anchor="middle" fill="#991b1b" font-weight="700">Wrong arm2hpdl format (ELF → beef)</text>
    <text x="620" y="584" text-anchor="middle" fill="#7f1d1d" font-size="13">Use HPLIP's hp_laserjet_1020.fw.gz (ACL) instead — docs/03</text>

    <!-- network branch -->
    <rect x="40" y="180" width="320" height="150" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="200" y="212" text-anchor="middle" fill="#5b21b6" font-weight="700">Printer prints locally, but</text>
    <text x="200" y="234" text-anchor="middle" fill="#5b21b6" font-weight="700">clients can't see/use it?</text>
    <text x="200" y="262" text-anchor="middle" fill="#334155" font-size="13">Windows: install/start wsdd (WS-Discovery)</text>
    <text x="200" y="282" text-anchor="middle" fill="#334155" font-size="13">Samba: add explicit browsable printer share</text>
    <text x="200" y="302" text-anchor="middle" fill="#334155" font-size="13">Guest blocked: use the printer account — docs/05</text>
    <path d="M360,255 L428,255" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#d)" fill="none"/>
  </g>
</svg>
