# systemd drop-in template for smbd/nmbd.
#
# Install as /etc/systemd/system/smbd.service.d/override.conf (and the same for
# nmbd). It makes Samba wait until the shared drive is mounted, so the share is
# never empty after boot. Replace <USER> and <LABEL>, or let
# scripts/restore-printer-and-shares.sh generate it for you.

[Unit]
RequiresMountsFor=/media/<USER>/<LABEL>
After=network-online.target
