# =============================================================================
#  Samba configuration for sharing a CUPS queue (HP LaserJet 1020) to Windows
#  See docs/05-windows-sharing.md for the reasoning behind every option.
#
#  Place at /etc/samba/smb.conf. Adjust WORKGROUP and the printer share name.
# =============================================================================

[global]
   workgroup = WORKGROUP
   server string = %h print server (%v)
   netbios name = SERVER
   server role = standalone server
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   map to guest = bad user
   usershare allow guests = yes
   dns proxy = no
   disable spoolss = no

   # --- printing via CUPS -------------------------------------------------
   printing = cups
   printcap name = cups
   load printers = yes
   # Host-based (GDI) printer: Windows renders with HP's driver and the server
   # must pass the raw stream straight to the printer (no CUPS re-filtering).
   cups options = raw

# ---------------------------------------------------------------------------
#  The [printers] wildcard is forced non-browsable by Samba. Keep it so any
#  CUPS queue is printable by name, but ALSO define an explicit browsable
#  share below so the printer is actually listed to clients.
# ---------------------------------------------------------------------------
[printers]
   comment = All Printers
   browseable = yes
   path = /var/spool/samba
   printable = yes
   guest ok = yes
   read only = yes
   create mask = 0700
   use client driver = yes

[print$]
   comment = Printer Drivers
   path = /var/lib/samba/printers
   browseable = yes
   read only = yes
   guest ok = yes
   write list = root

# ---------------------------------------------------------------------------
#  Explicit, browsable printer share.
#  `printer name` MUST equal the CUPS queue name.
#  Rename this section (and printer name) to match your queue if different.
# ---------------------------------------------------------------------------
[HP-LaserJet-1020]
   comment = HP LaserJet 1020 (USB, shared)
   printer name = HP-LaserJet-1020
   path = /var/spool/samba
   printable = yes
   browseable = yes
   guest ok = yes
   read only = yes
   create mask = 0700
   use client driver = yes

# ---------------------------------------------------------------------------
#  OPTIONAL: a shared folder with full write access for everyone.
#  Added automatically by scripts/restore-printer-and-shares.sh when you set
#  ENABLE_DRIVE_SHARE=yes. Template:
#
#  [shared]
#     comment = Shared folder
#     path = /media/<user>/<label>
#     browseable = yes
#     guest ok = yes
#     read only = no
#     writable = yes
#     force user = <user>
#     force group = <user>
#     create mask = 0777
#     directory mask = 0777
# ---------------------------------------------------------------------------
